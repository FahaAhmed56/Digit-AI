<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digit AI – Draw a digit</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>✍️ Digit AI</h1>
    <p>Draw a digit from 0 to 9. A neural network trained from scratch reads it live, in your browser.</p>
  </header>

  <main>
    <section class="panel">
      <canvas id="pad" width="280" height="280"></canvas>
      <div class="row">
        <button id="clear">Clear</button>
        <span class="hint">Draw large and centred</span>
      </div>
    </section>

    <section class="panel result">
      <div class="big">
        <div id="guess">?</div>
        <div id="conf">Start drawing</div>
      </div>
      <div id="bars"></div>
      <div class="seen">
        <small>What the network sees (8×8)</small>
        <canvas id="preview" width="96" height="96"></canvas>
      </div>
    </section>
  </main>

  <footer>64 → 128 (ReLU) → 10 (softmax) · 98% test accuracy · <a href="https://github.com/FahaAhmed56/digit-ai">source</a></footer>

  <script src="model.js"></script>
  <script src="nn.js"></script>
  <script src="app.js"></script>
</body>
</html>
